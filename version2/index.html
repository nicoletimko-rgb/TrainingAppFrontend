<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0a1130">
  <title>Nicole Timko | Summer Training</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Shared basketball graphic used by every court diagram -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <g id="ball">
        <circle r="12" fill="#f47b32"/>
        <path d="M-12 0H12M0-12V12M-8.5-8.5Q0 0-8.5 8.5M8.5-8.5Q0 0 8.5 8.5" fill="none" stroke="#2a1206" stroke-width="1.4"/>
      </g>
    </defs>
  </svg>

  <header class="hero">
    <div class="wrap">
      <p class="brand">Nicole Timko <span>Summer Training</span></p>

      <h1>Drills from<br>a pro.<br>Reps from you.</h1>

      <div class="court-art" aria-hidden="true">
        <div class="court-circle"></div>
        <div class="court-line"></div>
        <div class="basketball"></div>
      </div>

      <p class="specs">
        <span>College Athlete</span>
        <span>Carnegie Mellon University</span>
        <span>Grades 6–12</span>
      </p>
    </div>
  </header>

  <nav id="tabs" class="tabs" aria-label="Skills"><div class="wrap" id="tabs-in"></div></nav>

  <main class="wrap">
    <div class="page-head">
      <h2 id="title"></h2>
      <p id="blurb"></p>
      <div id="levels" class="levels" role="group" aria-label="Filter by level"></div>
    </div>

    <section id="grid" class="grid" aria-live="polite"></section>

    <section id="strength" class="strength" hidden>
      <form id="exercise-form" novalidate>
        <label>Muscle focus
          <select id="focus">
            <option value="legs">Legs</option>
            <option value="core">Core</option>
            <option value="upper">Chest / upper body</option>
          </select>
        </label>
        <label>Difficulty
          <select id="exercise-level">
            <option value="beginner">Beginner</option>
            <option value="intermediate" selected>Intermediate</option>
            <option value="advanced">Advanced</option>
          </select>
        </label>
        <button id="exercise-submit" type="submit" class="btn">Find exercises</button>
      </form>
      <p id="exercise-status" role="status" aria-live="polite" class="status">Pick a focus and difficulty to see exercises.</p>
      <div id="exercise-results" hidden></div>
    </section>
  </main>

  <footer class="wrap">
    <span>Nicole Timko Summer Training</span>
    <a href="https://www.instagram.com/nicole.timko/" target="_blank" rel="noopener">@nicole.timko</a>
  </footer>

  <dialog id="viewer" aria-labelledby="viewer-title">
    <button id="viewer-close" class="close" type="button" aria-label="Close">&times;</button>
    <div class="sheet">
      <div id="media" class="media"></div>
      <div class="info">
        <p id="viewer-meta" class="meta"></p>
        <h3 id="viewer-title"></h3>
        <p id="viewer-desc" class="desc"></p>
        <div id="court-wrap" hidden>
          <div id="court-box"></div>
          <div class="court-bar">
            <span id="court-label" aria-live="polite"></span>
            <button id="court-toggle" type="button" class="btn small">Pause</button>
          </div>
        </div>
      </div>
    </div>
  </dialog>

  <script src="app.js" defer></script>
</body>
</html>
